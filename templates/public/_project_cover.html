<div class="project-cover">
  <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs><linearGradient id="pc{{ p.id }}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--primary)" stop-opacity=".55"/><stop offset="1" stop-color="var(--accent)" stop-opacity=".25"/></linearGradient></defs>
    <rect width="400" height="250" fill="url(#pc{{ p.id }})"/>
    {% for i in range(9) %}<line x1="{{ i * 50 }}" y1="0" x2="{{ i * 50 }}" y2="250" class="pc-grid"/>{% endfor %}
    {% for i in range(6) %}<line x1="0" y1="{{ i * 50 }}" x2="400" y2="{{ i * 50 }}" class="pc-grid"/>{% endfor %}
    <path class="pc-wave" d="M0 170 C 60 120, 100 210, 160 160 S 260 110, 320 150 S 380 190, 400 160"/>
    <path class="pc-wave pc-wave-2" d="M0 190 C 70 150, 120 230, 180 180 S 270 140, 330 175 S 385 200, 400 185"/>
  </svg>
  <span class="project-cover-title">{{ p.title }}</span>
</div>
