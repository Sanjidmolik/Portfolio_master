{% extends "public/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="section error-page">
  <div class="container error-inner">
    <div class="error-screen" aria-hidden="true">
      <div class="colorbars">{% for c in ['#c0c0c0','#c0c000','#00c0c0','#00c000','#c000c0','#c00000','#0000c0'] %}<span style="background:{{ c }}"></span>{% endfor %}</div>
      <p class="error-code mono">{{ code }}</p>
    </div>
    <h1 class="section-title">{{ title }}</h1>
    <p class="section-sub">{{ message }}</p>
    <p class="hero-ctas"><a class="btn btn-primary" href="{{ url_for('public.home') }}">{{ icon('arrow-left') }} Back to home</a></p>
  </div>
</section>
{% endblock %}
